name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (tests + linters)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ./backend

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install \
            pytest pytest-asyncio coverage \
            httpx asgi-lifespan aiosqlite Faker factory_boy \
            ruff black

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Run tests
        run: pytest -q --maxfail=1 --disable-warnings

  frontend:
    name: Frontend (jest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install deps
        run: npm ci

      # Optional: typecheck or build if you want
      # - name: Typecheck
      #   run: npx tsc -p tsconfig.app.json --noEmit
      # - name: Build
      #   run: npm run build

      - name: Run Jest
        env:
          CI: true
        run: npm run test:run
