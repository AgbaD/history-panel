networks:
  app-net:
    name: history-net
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d history -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - app-net

  extension-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./extension:/app
      - /app/node_modules
    environment:
      VITE_API_BASE: http://localhost:8000
    command: sh -c "npm ci && npm run build"
    depends_on:
      api:
        condition: service_started
    networks:
      - app-net

volumes: 
  pgdata: